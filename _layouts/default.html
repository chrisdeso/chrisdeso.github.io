<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% assign section = page.url | split: '/' | slice: 1 | first %}
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/blog/' | relative_url }}"{% if section == 'blog' %} aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/projects/' | relative_url }}"{% if section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/now/' | relative_url }}"{% if section == 'now' %} aria-current="page"{% endif %}>Now</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span>
        <a href="https://github.com/chrisdeso">github</a> ·
        <a href="{{ '/blog/feed.xml' | relative_url }}">rss</a>
      </span>
    </footer>
  </div>
</body>
</html>
