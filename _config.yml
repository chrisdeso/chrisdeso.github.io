title: chrisdeso
description: finding nemo 🐠
url: https://chrisdeso.com
author: Chris de Sousa
lang: en-US

timezone: America/Chicago
permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

# Order shown on /projects/ and the homepage.
project_status_order: [active, shipped, coursework, idea, archived]

feed:
  path: blog/feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - bin
  - .bundle
